name: publish-docs

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Generate benchmark reports
        run: |
          python scripts/benchmarks_core.py --profile smoke --json benchmark-core.json --summary > benchmark-core.md
          python scripts/benchmarks_cli.py --profile smoke --json benchmark-cli.json --summary > benchmark-cli.md

      - name: Build Jekyll source tree
        run: |
          python scripts/build_pages_site.py \
            --output _site_src \
            --core-summary benchmark-core.md \
            --cli-summary benchmark-cli.md \
            --core-json benchmark-core.json \
            --cli-json benchmark-cli.json

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
