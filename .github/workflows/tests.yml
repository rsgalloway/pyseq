name: tests

on:
  push:
    branches:
      - main
    paths:
      - "lib/pyseq/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".flake8"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "lib/pyseq/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".flake8"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and quality dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Check import ordering
        run: python -m isort --check-only --diff lib/pyseq tests scripts

      - name: Check black formatting
        run: python -m black --check lib/pyseq tests scripts

      - name: Run flake8 and mccabe checks
        run: python -m flake8 lib/pyseq tests scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q
